$('graph-note').textContent=data.puzzle.kind==='cryptarithm'?'Blue nodes are letters. Gray nodes encode columns and carries; their labels show initial domain sizes.':'Each column is a variable. Edges prohibit shared rows and diagonals.';
const notices=[];if(!data.complete)notices.push('Search stopped at a configured limit; more solutions may exist.');if(data.trace_truncated)notices.push('Replay capture limit reached. Saved solutions remain available above.');if(!data.trace.length)notices.push('No replay was recorded.');$('notice').textContent=notices.join(' ');
function board(domains){const n=data.puzzle.size,size=440,cell=size/n,pad=20;const svg=element('svg',{viewBox:`0 0 ${size+pad+6} ${size+pad+6}`,class:'board',role:'img','aria-label':`${n} by ${n} queens board`});for(let r=0;r<n;r++)for(let c=0;c<n;c++){const x=pad+c*cell,y=r*cell,allowed=domains[c].includes(r),fixed=data.initial_domains[c].length===1&&data.initial_domains[c][0]===r;svg.append(element('rect',{x,y,width:cell,height:cell,fill:(c+r)%2?'#1c2b3d':'#283b50'}));if(allowed&&domains[c].length===1){const conflict=domains.some((d,j)=>j!==c&&d.length===1&&(d[0]===r||Math.abs(d[0]-r)===Math.abs(j-c)));svg.append(element('circle',{cx:x+cell/2,cy:y+cell/2,r:cell*.36,fill:conflict?'#613946':'#315c4f',stroke:fixed?'#f3c878':'none','stroke-width':2}));svg.append(element('text',{x:x+cell/2,y:y+cell*.68,'text-anchor':'middle','font-size':cell*.58,fill:conflict?'#fb8f9b':'#7de3bd'},'♛'));}else if(allowed){svg.append(element('circle',{cx:x+cell/2,cy:y+cell/2,r:Math.max(1.5,cell*.055),fill:'#8bbcf5',opacity:.8}));}else if(!data.initial_domains[c].includes(r)){svg.append(element('path',{d:`M ${x+cell*.4} ${y+cell*.4} l ${cell*.2} ${cell*.2} m 0 ${-cell*.2} l ${-cell*.2} ${cell*.2}`,stroke:'#75839a','stroke-width':1}));}}for(let c=0;c<n;c++)svg.append(element('text',{x:pad+(c+.5)*cell,y:size+15,'text-anchor':'middle','font-size':Math.min(11,cell*.65),fill:'#9aaabd'},c));for(let r=0;r<n;r++)svg.append(element('text',{x:9,y:(r+.5)*cell+4,'text-anchor':'middle','font-size':Math.min(11,cell*.65),fill:'#9aaabd'},r));return svg;}
function equation(domains){const wrap=document.createElement('div');wrap.className='equation';const mapping=Object.fromEntries(data.variables.map((name,i)=>[name,domains[i].length===1?domains[i][0]:null]));data.puzzle.words.forEach((word,i)=>{const row=document.createElement('div');row.className='equation-row';if(i===1){const plus=document.createElement('span');plus.className='plus';plus.textContent='+';row.append(plus);}for(const letter of word){const tile=document.createElement('div');tile.className='letter-tile';const value=document.createElement('b');value.textContent=mapping[letter]===null?'·':mapping[letter];const label=document.createElement('span');label.textContent=letter;tile.append(value,label);row.append(tile);}wrap.append(row);});if(Object.values(mapping).every(x=>x!==null)){const values=data.puzzle.words.map(w=>Number([...w].map(l=>mapping[l]).join('')));const text=document.createElement('div');text.className='arithmetic';text.textContent=`${values[0]} + ${values[1]} ${values[0]+values[1]===values[2]?'=':'≠'} ${values[2]}`;wrap.append(text);}return wrap;}
function graph(domains){const svg=$('graph');svg.replaceChildren();const nodes=data.graph.nodes;const positions=nodes.map((_,i)=>[210+164*Math.cos(2*Math.PI*i/nodes.length-Math.PI/2),115+88*Math.sin(2*Math.PI*i/nodes.length-Math.PI/2)]);for(const [a,b]of data.graph.edges)svg.append(element('line',{x1:positions[a][0],y1:positions[a][1],x2:positions[b][0],y2:positions[b][1],stroke:'#35465d','stroke-width':1,opacity:.65}));nodes.forEach((node,i)=>{const [x,y]=positions[i],visibleIndex=data.variables.indexOf(node.name),assigned=visibleIndex>=0&&domains[visibleIndex].length===1;const group=element('g');group.append(element('title',{},node.name+': '+(visibleIndex>=0?domains[visibleIndex].join(', '):node.domain_size+' initial values')));group.append(element('circle',{cx:x,cy:y,r:node.visible?13:8,fill:assigned?'#315c4f':node.visible?'#2b4260':'#344051',stroke:assigned?'#7de3bd':'#72839b','stroke-width':1}));group.append(element('text',{x,y:y+3,'text-anchor':'middle','font-size':node.visible?8:7,fill:node.visible?'#eef4fc':'#c4cedc'},node.visible?node.name:node.domain_size));svg.append(group);});}
function draw(){const event=events[index],domains=selected>=0?data.solutions[selected].map(v=>[v]):event.domains;$('view').value=selected;$('stage').replaceChildren(data.puzzle.kind==='nqueens'?board(domains):equation(domains));$('domains').replaceChildren();data.variables.forEach((name,i)=>{const row=document.createElement('div');row.className='domain-row';const label=document.createElement('div');label.className='var-name';label.textContent=name;const values=document.createElement('div');values.className='domain-values';for(let value=0;value<(data.puzzle.kind==='nqueens'?data.puzzle.size:10);value++){const badge=document.createElement('span');badge.className='digit'+(!domains[i].includes(value)?' off':domains[i].length===1?' single':'');badge.textContent=value;values.append(badge);}if(!domains[i].length){const empty=document.createElement('span');empty.className='digit empty';empty.textContent='∅';values.append(empty);}row.append(label,values);$('domains').append(row);});graph(domains);$('scrubber').value=index;$('position').textContent=selected>=0?'Saved solution':`${index+1} / ${events.length}`;$('event-type').textContent=selected>=0?'solution':event.type;$('detail').textContent=selected>=0?`Verified assignment ${selected+1}. Play to inspect how the search progressed.`:event.detail;$('depth').textContent=selected>=0?'All assigned':'Depth '+event.depth;$('prev').disabled=selected<0&&index===0;$('next').disabled=selected<0&&index===events.length-1;$('play').disabled=events.length<=1;$('scrubber').disabled=events.length<=1;}
function pause(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='▶ Play';}
function seek(next){pause();selected=-1;index=Math.max(0,Math.min(events.length-1,next));draw();}
function play(){if(timer!==null){pause();return;}if(selected>=0||index===events.length-1){selected=-1;index=0;}draw();$('play').textContent='Ⅱ Pause';timer=setInterval(()=>{if(index>=events.length-1){pause();return;}index++;draw();if(index===events.length-1)pause();},Number($('speed').value));}
$('play').addEventListener('click',play);$('reset').addEventListener('click',()=>seek(0));$('prev').addEventListener('click',()=>seek(index-1));$('next').addEventListener('click',()=>seek(index+1));$('scrubber').addEventListener('input',e=>seek(Number(e.target.value)));$('view').addEventListener('change',e=>{pause();selected=Number(e.target.value);draw();});$('speed').addEventListener('change',()=>{if(timer!==null){pause();play();}});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();seek(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();seek(index-1);}if(e.code==='Space'&&events.length>1){e.preventDefault();play();}});draw();
</script>
